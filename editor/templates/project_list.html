{% extends "base.html" %}
{% block content %}
{% if projects %}
    <form method="POST" action="{% url 'new_project' %}" style="text-align: center;">
        <br><h3>Create New project</h3><br>
        {% csrf_token %}
        <input placeholder="Enter project name" name="projectname">
        <button type="submit">Create</button>
    </form>
    {% for project in projects %}
    <ul>
        <li><a href="{% url 'editor' project.id %}" class="link-light link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover"> {{project.name}}</a></li>
    </ul>
    {% endfor %}
    {% else %}
    <form method="POST" action="{% url 'new_project' %}" style="text-align: center;">
        <br><h3>Create New project</h3><br>
        {% csrf_token %}
        <input placeholder="Enter project name" name="projectname">
        <button type="submit">Create</button>
    </form>
    {% endif %}
{% endblock %}

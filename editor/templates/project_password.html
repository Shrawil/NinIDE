{% extends "base.html" %}

{% block title %}
Unlock {{ project.name }} | NinIDE
{% endblock %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: calc(100vh - 120px);">
    <div class="card bg-dark text-light border-secondary shadow-lg w-100" style="max-width: 420px;">
        <div class="card-body p-4 text-center">
            
            <div class="mb-3">
                <i class="bi bi-shield-lock text-warning display-4"></i>
            </div>

            <h4 class="card-title mb-1 text-truncate" title="{{ project.name }}">
                {{ project.name }}
            </h4>
            <p class="text-secondary small mb-4">Enter password to access this project</p>

            {% if error %}
                <div class="alert alert-danger alert-dismissible fade show border-0 py-2 px-3 mb-4 text-start small" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                
                <div class="mb-3">
                    <input 
                        type="password" 
                        name="password" 
                        class="form-control bg-black text-light border-secondary text-center py-2" 
                        placeholder="Enter password..."
                        autocomplete="off"
                        autocorrect="off"
                        autocapitalize="off"
                        spellcheck="false"
                        required
                        autofocus
                    >
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                    <i class="bi bi-unlock-fill me-1"></i> Unlock Project
                </button>
            </form>

        </div>
    </div>
</div>
{% endblock %}

{% block css %}
<style>
    body {
        background-color: #1e1e1e;
        color: #d4d4d4;
    }

    /* Input focus styling */
    .form-control:focus {
        background-color: #000 !important;
        color: #fff !important;
        border-color: #0e639c !important;
        box-shadow: 0 0 0 0.25rem rgba(14, 99, 156, 0.25) !important;
    }

    .form-control::placeholder {
        color: #858585;
    }
</style>
{% endblock %}

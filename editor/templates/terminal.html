{% extends "base.html" %}

{% block title %}
Terminal | {{ project.name }}
{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">

        <h3>
            Terminal — {{ project.name }}
        </h3>

        <a
            href="{% url 'editor' project.id %}"
            class="btn btn-secondary"
        >
            <i class="bi bi-arrow-left"></i>
            Back to Editor
        </a>

    </div>

    <!-- terminal output -->
    <div class="bg-dark text-light p-3 rounded"
         style="height:60vh; overflow:auto; font-family:monospace;">

        <pre>{{ output }}</pre>

    </div>

    <!-- command input -->
    <form method="POST" class="mt-3">
        {% csrf_token %}

        <div class="input-group">
            <span class="input-group-text bg-dark text-light">$</span>

            <input
                type="text"
                name="command"
                class="form-control"
                placeholder="Enter command..."
                autocomplete="off"
                autofocus
            >

            <button class="btn btn-primary">
                Run
            </button>

            <button
                type="submit"
                name="action"
                value="stop"
                class="btn btn-danger"
            >
                Stop Server
            </button>

            {% if server_running %}

            <a
                href="{{ server_url }}"
                target="_blank"
                class="btn btn-success"
            >
                <i class="bi bi-globe"></i>
                Open Website
            </a>

            {% endif %}

        </div>
    </form>

</div>

{% endblock %}
